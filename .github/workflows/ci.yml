name: Validate site

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx astro telemetry disable
      - run: npm run build
      - run: git diff --exit-code -- index.html robots.txt sitemap.xml og.png apple-touch-icon.png icon-32.png
